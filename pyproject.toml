[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "awesome-windows-attestation"
version = "0.1.0"
description = "Awesome Windows Attestation [![Awesome](https://cdn.jsdelivr.net/gh/sindresorhus/awesome@d1b8710/media/badge.svg)](https://github.com/sindresorhus/awesome)"
readme = "README.md"
license = {text = "MIT"}
# authors = see repository metadata
requires-python = ">=3.11"
keywords = ["zqm"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.11"]

[project.urls]
Homepage = "https://github.com/ZQM-Labs/awesome-windows-attestation"
Repository = "https://github.com/ZQM-Labs/awesome-windows-attestation.git"
